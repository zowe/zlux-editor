<div class="main-container">
  <aside class="gz-tree" [style.maxWidth]="showExplorer ? '315px':'0px'">
    <div class="section-container" [ngClass]="{'active':this.activityBar[0].active}">
      <app-project-tree></app-project-tree>
    </div>
  </aside>
  <div class="toggle-tree-bar" (click)="toggleTree()">
    <label class="toggle-tree" [hidden]="!showExplorer"><</label>
    <label class="toggle-tree" [hidden]="showExplorer">></label>
  </div>
  <div class="gz-editor-and-terminal">
    <div class="gz-editor" [style.height]="showTerminal ? 'calc(100% - ' + terminalHeight + 'px)' : '100%'">
      <app-code-editor></app-code-editor>
    </div>
    @if (showTerminal) {
      <div class="terminal-resize-handle" (mousedown)="onTerminalResizeStart($event)"></div>
      <div class="gz-terminal" [style.height.px]="terminalHeight">
        <app-terminal-panel></app-terminal-panel>
      </div>
    }
  </div>
</div>
