<div class="file-explorer-container" style="display: flex; flex-direction: column; height: 100%;">
  <zlux-file-tree #fileExplorer
    (nodeClick)="onNodeClick($event)"
    (openInNewTab)="onOpenInNewTab($event)"
    (deleteClick)="onDeleteClick($event)"
    (pathChanged)="onPathChanged($event)"
    (newFileClick)="onNewFileClick($event)"
    [style]="{'flex': '1', 'min-height': '0', 'overflow': 'hidden'}"
  >
  </zlux-file-tree>
</div>
