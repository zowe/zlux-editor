<zlux-tab-trap></zlux-tab-trap>
<div class="d-flex flex-align-items-start" data-testid="session-picker-dialog">
  <div>
    <h2 mat-dialog-title data-testid="session-picker-title">Restore Editor Session</h2>
  </div>
  <button mat-dialog-close class="close-dialog-btn" data-testid="session-picker-close" (click)="onSkip()">
    <i class="fa fa-close"></i>
  </button>
</div>
<mat-dialog-content>
  <p *ngIf="sessions.length === 0">No saved sessions found.</p>

  <div *ngIf="sessions.length > 0" class="session-list">
    <div *ngFor="let session of sessions"
         class="session-item"
         [class.selected]="selectedId === session.id"
         [class.last-used]="session.id === lastSessionId"
         (click)="select(session.id)"
         (dblclick)="onRestore()">
      <div class="session-header">
        <span class="session-name">{{ session.name }}</span>
        <span class="session-badge" *ngIf="session.id === lastSessionId">last used</span>
      </div>
      <div class="session-meta">
        <span>{{ session.tabCount }} tab{{ session.tabCount !== 1 ? 's' : '' }}</span>
        <span class="session-date">{{ formatDate(session.updatedAt) }}</span>
      </div>
      <button mat-icon-button class="session-delete" (click)="onDelete(session.id, $event)"
              title="Delete session" *ngIf="session.id !== 'default'">
        <i class="fa fa-trash"></i>
      </button>
    </div>
  </div>

  <div class="new-session-row">
    <mat-form-field appearance="outline" class="new-session-field">
      <mat-label>New session name</mat-label>
      <input matInput [(ngModel)]="newSessionName" (keydown.enter)="onCreateNew()" data-testid="new-session-input">
    </mat-form-field>
    <button mat-flat-button color="accent" (click)="onCreateNew()" [disabled]="!newSessionName.trim()"
            data-testid="new-session-btn">Create New</button>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-flat-button color="primary" (click)="onRestore()" [disabled]="!selectedId"
          data-testid="session-restore-btn">Restore</button>
  <button mat-button (click)="onSkip()" data-testid="session-skip-btn">Start Empty</button>
</mat-dialog-actions>
