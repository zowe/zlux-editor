<zlux-tab-trap></zlux-tab-trap>
<div class="d-flex flex-align-items-start">
  <div>
    <h2 mat-dialog-title>Create Dataset Member</h2>
  </div>
  <button mat-dialog-close class="close-dialog-btn"><i class="fa fa-close"></i></button>
</div>
<mat-dialog-content>
  <p>Dataset: <strong>{{datasetName}}</strong></p>
  <mat-form-field style="width: 100%">
    <mat-label>Member Name (1-8 chars)</mat-label>
    <input matInput type="text" maxlength="8"
      [(ngModel)]="memberName"
      #nameInput="ngModel"
      [pattern]="memberNamePattern"
      oninput="this.value = this.value.toUpperCase()"
      required>
    @if (nameInput.invalid) {
    <mat-error>
      Invalid member name. Must start with A-Z, #, $, or @, followed by up to 7 alphanumeric characters.
    </mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-stroked-button class="right" color="primary"
    [mat-dialog-close]="memberName"
    [disabled]="!isValid">
    Create
  </button>
</mat-dialog-actions>
