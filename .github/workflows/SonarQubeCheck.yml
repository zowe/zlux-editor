name: SonarQube Quality Check

on:
  pull_request:
    branches: [ "main", "v3.x/staging" ]
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: webClient

    steps:
      - name: Checkout PR head with limited history
        uses: actions/checkout@v4
        with:
          ref: SonarQubeIntegration
          fetch-depth: 0
        # Checkout action usage and fetch-depth behavior reference [11][12]

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm
        run: npm install

      - name: Install deps
        run: npm ci

      - name: Test with coverage (Jest)
        run: npm test --if-present -- --coverage
        env:
          CI: true

      - name: SonarQube Scan
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        #  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Psonar.host.url=$SONAR_HOST_URL
            -Dsonar.token=$SONAR_TOKEN
            -Dsonar.projectKey=zowe_zlux-editor
            -Dsonar.organization=zowe
            -Dsonar.sources=webClient
            -Dsonar.tests=webClient/src/app
            -Dsonar.test.inclusions=**/*.(spec|test).ts,**/*.(spec|test).tsx,**/*.(spec|test).js,**/*.(spec|test).jsx
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts
            -Dsonar.javascript.lcov.reportPaths=webClient/coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
